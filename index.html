<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>🎓 Student Performance Predictor</h1>

            <p class="subtitle">
                Predict student marks using Machine Learning
            </p>

            <form action="/predict" method="POST">

                <div class="input-group">
                    <label>Study Hours</label>
                    <input type="number" step="any" name="study_hours" placeholder="Enter study hours" required>
                </div>

                <div class="input-group">
                    <label>Attendance (%)</label>
                    <input type="number" step="any" name="attendance" placeholder="Enter attendance percentage" required>
                </div>

                <div class="input-group">
                    <label>Sleep Hours</label>
                    <input type="number" step="any" name="sleep_hours" placeholder="Enter sleep hours" required>
                </div>

                <div class="input-group">
                    <label>Previous Marks</label>
                    <input type="number" step="any" name="previous_marks" placeholder="Enter previous marks" required>
                </div>

                <div class="input-group">
                    <label>Assignments Completed</label>
                    <input type="number" step="any" name="assignments" placeholder="Assignments completed" required>
                </div>

                <button type="submit">Predict Marks 🚀</button>

            </form>

            {% if prediction %}
            <div class="result-box">

                <h2>📊 Predicted Marks</h2>

                <p>{{ prediction }}</p>

                {% if prediction >= 90 %}
                    <span class="grade">Grade: A+</span>

                {% elif prediction >= 75 %}
                    <span class="grade">Grade: A</span>

                {% elif prediction >= 60 %}
                    <span class="grade">Grade: B</span>

                {% else %}
                    <span class="grade">Grade: C</span>

                {% endif %}

            </div>
            {% endif %}

        </div>

    </div>

</body>
</html>
